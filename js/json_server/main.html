<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="font-family: Arial, sans-serif; margin: 30px; background-color: #f5f5f5;">

    <div style="margin-bottom: 20px;">

        <button
        id="post_btn"
            style="
                padding: 10px 20px;
                margin-right: 10px;
                border: none;
                border-radius: 5px;
                background-color: #007bff;
                color: white;
                cursor: pointer;
            ">
            Post
        </button>

        <button
        id="get_btn"
            style="
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                background-color: #28a745;
                color: white;
                cursor: pointer;
            ">
            Get
        </button>

    </div>

   <table id="table">
            <thead>
                <th>S.no</th>
                <th>name</th>
                <th>Email</th>
                <th>op-1</th>
                <th>op-2</th>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    
    <form
    id="register_form"
    style="
    display: none;
        width: 350px;
        margin: 50px auto;
        padding: 25px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    "
>

    <input
        type="text"
        id="name"
        placeholder="Enter your name"
        style="
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        "
    >

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        style="
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        "
    >

    <input
        type="password"
        id="password"
        placeholder="Enter password"
        style="
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        "
    >

    <input
        type="password"
        id="confirm_password"
        placeholder="Confirm password"
        style="
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        "
    >

    <select
        id="role"
        style="
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        "
    >
        <option value="">Select Role</option>
        <option value="student">Student</option>
        <option value="trainer">Trainer</option>
    </select>

    <button
        type="submit"
        style="
            width: 100%;
            padding: 12px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        "
        id="register"
    >
        Register
    </button>

</form>


    <script src="./main.js"></script>

</body>
</html>
